# Builds the static export and publishes it to GitHub Pages.
#
# Runs on every push to main, by hand, on `repository_dispatch` with event
# type `aetox-release`, and once a day. The version badge is read from GitHub
# Releases at build time, and nothing in the Aetox repo fires the dispatch —
# the live page said v1.7.5 on 27 Sep 2026 with v1.9.0 out — so the daily
# build is what keeps it current without a commit here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [aetox-release]
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # raises the Releases API rate limit; the token is read-only here
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
